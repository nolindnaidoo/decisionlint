# Not from the family: this repo alone declares a vendor's model version.
# Fails when `jev-latest` no longer points to KNOWN_VERSION in
# src/lint/limits.ts, which is otherwise found only by someone reading
# TypeSafe's models page.
name: Jev release

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: jev-latest is the declared version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      # No install: the script imports nothing outside src/.
      - name: Read the models page
        run: bun run check:jev-release
