# For https://pre-commit.com. In a project's .pre-commit-config.yaml:
#
#   - repo: https://github.com/nolindnaidoo/decisionlint
#     rev: v1.1.0
#     hooks:
#       - id: decisionlint
#
# It runs the published command line through npx, so Node 20 or newer has to
# be on the machine. The version is pinned to the release this file belongs
# to, and a test holds the two together.
- id: decisionlint
  name: DecisionLint
  description: Lint Jev and Luna decision-model questions. No API key and no network calls.
  entry: npx --yes decisionlint@1.1.0 --no-error-on-unmatched-pattern
  language: system
  files: \.(json|jsonc|js|jsx|mjs|cjs|ts|tsx|mts|cts|py|rs|go)$
# The id JevLint-LE shipped with, so a project that bumps `rev` without
# changing its hook id keeps working. pre-commit reads this file at the tag,
# which is why the old id has to be in every release from 1.0.0 on.
- id: jevlint-le
  name: DecisionLint (as jevlint-le)
  description: The same hook under the name it had before 1.0.0.
  entry: npx --yes decisionlint@1.1.0 --no-error-on-unmatched-pattern
  language: system
  files: \.(json|jsonc|js|jsx|mjs|cjs|ts|tsx|mts|cts|py|rs|go)$
